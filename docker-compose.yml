services:
  db:
    image: postgres:16
    container_name: bpt_db
    environment:
      POSTGRES_USER: bpt
      POSTGRES_PASSWORD: bpt
      POSTGRES_DB: bpt
    volumes:
      - bpt_pg:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: bpt_backend
    env_file:
      - ./backend/.env
    depends_on:
      - db
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bpt_frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  bpt_pg:
